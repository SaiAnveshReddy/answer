<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#1E1B3A">
  <title>For Chhoti Chand 🌙</title>
  <meta name="description" content="A little page, under a little moon.">

  <!-- Link preview (WhatsApp etc.) -->
  <meta property="og:title" content="For Chhoti Chand 🌙">
  <meta property="og:description" content="A little page, under a little moon.">
  <meta property="og:type" content="website">

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%99%3C/text%3E%3C/svg%3E">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="state-intro">

  <!-- ===== Scene ===== -->
  <div class="sky" aria-hidden="true"></div>
  <canvas id="stars" class="stars" aria-hidden="true"></canvas>

  <button class="moon" id="moon" type="button" aria-label="Tap the moon to begin">
    <span class="moon-halo" aria-hidden="true"></span>
    <svg class="moon-svg" viewBox="0 0 200 200" aria-hidden="true">
      <defs>
        <!-- soft edge between day and night on the moon -->
        <filter id="softEdge" filterUnits="userSpaceOnUse" x="0" y="0" width="200" height="200">
          <feGaussianBlur stdDeviation="1.6"/>
        </filter>
        <mask id="litMask" maskUnits="userSpaceOnUse" x="0" y="0" width="200" height="200">
          <path id="litPath" d="" fill="#fff" filter="url(#softEdge)"/>
        </mask>
      </defs>
      <g transform="rotate(-18 100 100)">
        <!-- night side: dark disc with a faint earthshine of the surface -->
        <circle cx="100" cy="100" r="70" fill="#151230"/>
        <image class="moon-img" x="30" y="30" width="140" height="140" opacity="0.08" href=""/>
        <!-- day side: the same surface, masked to the current phase -->
        <image class="moon-img" id="litImg" x="30" y="30" width="140" height="140" mask="url(#litMask)" href=""/>
      </g>
    </svg>
  </button>

  <div class="mountains" id="mountains" aria-hidden="true">
    <svg class="mtn far" viewBox="0 0 1200 400" preserveAspectRatio="none">
      <defs>
        <linearGradient id="gFar" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#A897E0"/>
          <stop offset="100%" stop-color="#7563BC"/>
        </linearGradient>
      </defs>
      <path fill="url(#gFar)" fill-opacity="0.75" d="M0 400 L0 230 L90 182 L160 204 L262 120 L340 176 L420 150 L520 72 L612 142 L690 116 L782 166 L880 96 L962 152 L1050 130 L1132 182 L1200 160 L1200 400 Z"/>
    </svg>
    <svg class="mtn mid" viewBox="0 0 1200 400" preserveAspectRatio="none">
      <defs>
        <linearGradient id="gMid" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#5B4B9A"/>
          <stop offset="100%" stop-color="#433680"/>
        </linearGradient>
      </defs>
      <path fill="url(#gMid)" d="M0 400 L0 262 C 100 252 150 192 240 186 C 330 180 380 250 470 246 C 560 242 610 172 700 168 C 790 166 850 240 940 238 C 1030 236 1090 200 1200 214 L1200 400 Z"/>
    </svg>
    <svg class="mtn near" viewBox="0 0 1200 400" preserveAspectRatio="none">
      <defs>
        <linearGradient id="gNear" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#2F2862"/>
          <stop offset="100%" stop-color="#201B44"/>
        </linearGradient>
      </defs>
      <path fill="url(#gNear)" d="M0 400 L0 318 C 120 298 200 268 300 274 C 400 280 460 320 560 314 C 660 308 720 278 820 281 C 920 284 1000 320 1100 311 C 1150 307 1180 300 1200 302 L1200 400 Z"/>
    </svg>
  </div>

  <div class="meadow" aria-hidden="true">
    <div class="lavender lav-back" id="lavBack"></div>
    <div class="flowers" id="flowers"></div>
    <div class="hero-sf" id="heroFlower"></div>
    <div class="lavender lav-front" id="lavFront"></div>
  </div>

  <div class="fireflies" id="fireflies" aria-hidden="true"></div>

  <!-- shared sunflower drawings (filled in by script.js) -->
  <svg id="sprites" width="0" height="0" style="position:absolute" aria-hidden="true"></svg>

  <!-- ===== Screens ===== -->
  <main class="ui">

    <section class="screen intro active" id="introScreen">
      <h1>Hey Chhoti Chand <span class="nowrap">🌙</span></h1>
      <p>You asked what I like in a girl.</p>
      <p class="tap-hint">Tap the moon to find out.</p>
    </section>

    <section class="screen cards" id="cardsScreen" aria-live="polite">
      <div class="dots" id="dots" aria-hidden="true"></div>

      <div class="card-stage">
        <div class="card" id="card" role="button" tabindex="0" aria-label="Turn the card">
          <div class="card-inner">
            <div class="face front">
              <span class="card-num" id="cardNum"></span>
              <h2 class="quality" id="quality"></h2>
              <span class="hint">tap to turn ✦</span>
            </div>
            <div class="face back">
              <p class="quote" id="quote"></p>
              <p class="note" id="note"></p>
            </div>
          </div>
        </div>
      </div>

      <div class="controls">
        <button class="btn ghost" id="prevBtn" type="button" aria-label="Previous">‹</button>
        <button class="btn" id="nextBtn" type="button" disabled>Next ›</button>
      </div>
    </section>

    <section class="screen final" id="finalScreen">
      <div class="message" id="message"></div>
      <p class="signature" id="signature"></p>
      <button class="btn ghost small again" id="againBtn" type="button">read them again</button>
    </section>

  </main>

  <!-- background music: soft piano, starts when she taps the moon -->
  <audio id="music" src="assets/music.mp3" preload="auto" loop playsinline></audio>
  <button class="sound-btn" id="soundBtn" type="button" aria-pressed="false" aria-label="Mute music">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <g class="note">
        <path d="M9 17.5V6.2l9-2v11.1" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        <ellipse cx="6.8" cy="17.6" rx="2.4" ry="1.9" fill="currentColor"/>
        <ellipse cx="15.8" cy="15.4" rx="2.4" ry="1.9" fill="currentColor"/>
      </g>
      <path class="slash" d="M4 4 L20 20" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    </svg>
  </button>

  <script src="script.js"></script>
</body>
</html>
